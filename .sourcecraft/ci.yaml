# Manual-only SourceCraft CI policy for DELIVERY_PROFILE=CRITICAL.
# Intentionally no `on:` section: branch push and pull request update must not
# start paid CI automatically. Workflows are launched explicitly by the merge
# session for an exact head SHA.

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Exact PR head SHA that this manual gate is allowed to verify.
    settings:
      max_cube_duration: 10m
    checkout:
      enabled: true
      fetch_depth: 1
      remove_credentials: true
    tasks:
      - name: verify
        cubes:
          - name: static-site-standard
            image: docker.io/library/node:24.20.0-alpine
            script:
              - |
                set -eu
                test "$SOURCECRAFT_EVENT" = "manual"
                test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"
                EXPECTED_COMMIT_SHA="${{ inputs.expected_commit_sha }}"
                export EXPECTED_COMMIT_SHA
                node scripts/verify-sourcecraft-head.mjs
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                node scripts/verify-runtime-versions.mjs
                corepack pnpm install --frozen-lockfile
                corepack pnpm verify

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Exact PR head SHA that this manual gate is allowed to verify.
      risk_reason:
        type: string
        required: true
        description: Human-readable reason why this head needs the RISKY gate.
    settings:
      max_cube_duration: 10m
    checkout:
      enabled: true
      fetch_depth: 1
      remove_credentials: true
    tasks:
      - name: verify
        cubes:
          - name: static-site-risky
            image: docker.io/library/node:24.20.0-alpine
            script:
              - |
                set -eu
                test "$SOURCECRAFT_EVENT" = "manual"
                test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"
                EXPECTED_COMMIT_SHA="${{ inputs.expected_commit_sha }}"
                export EXPECTED_COMMIT_SHA
                node scripts/verify-sourcecraft-head.mjs
                test -n "${{ inputs.risk_reason }}"
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                node scripts/verify-runtime-versions.mjs
                corepack pnpm install --frozen-lockfile
                corepack pnpm verify:release

  release-artifact:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: Exact main SHA to build and archive without deployment.
    settings:
      max_cube_duration: 10m
    checkout:
      enabled: true
      fetch_depth: 1
      remove_credentials: true
    tasks:
      - name: release
        cubes:
          - name: static-site-release
            image: docker.io/library/node:24.20.0-alpine
            script:
              - |
                set -eu
                test "$SOURCECRAFT_EVENT" = "manual"
                test "$SOURCECRAFT_COMMIT_REF" = "refs/heads/main"
                test "$SOURCECRAFT_COMMIT_SHA" = "${{ inputs.expected_commit_sha }}"
                EXPECTED_COMMIT_SHA="${{ inputs.expected_commit_sha }}"
                export EXPECTED_COMMIT_SHA
                node scripts/verify-sourcecraft-head.mjs
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                node scripts/verify-runtime-versions.mjs
                corepack pnpm install --frozen-lockfile
                corepack pnpm verify:release
                release_sha="${{ inputs.expected_commit_sha }}"
                archive="release-${release_sha}.tar.gz"
                mkdir -p release-artifacts
                tar -czf "release-artifacts/${archive}" -C out .
                checksum="$(sha256sum "release-artifacts/${archive}" | awk '{print $1}')"
                printf '%s  %s\n' "$checksum" "$archive" > "release-artifacts/${archive}.sha256"
                printf '{"schema":"ams24-release-manifest-v1","commit_sha":"%s","archive":"%s","sha256":"%s"}\n' "$release_sha" "$archive" "$checksum" > release-artifacts/manifest.json
            artifacts:
              paths:
                - release-artifacts/
